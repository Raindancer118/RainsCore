# ──────────────────────────────────────────────────────── questions typed into chat
# <problem> is what was wrong with the answer, <left> how many tries remain.
prompt:
  how: "<dark_gray>Type your answer in chat, or <white>cancel</white>. The clock is ticking: <seconds>s to answer."
  again: "<red><problem> <gray>Try again, <left> <tries> left. No pressure."
  gave-up: "<red><problem> That was the last try; nothing was changed. Better luck next time."
  timed-out: "<gray>No answer came, so nothing was changed. The silence was deafening."
  cancelled: "<gray>Cancelled. Nothing was changed, nobody is judging."
  busy: "<yellow>Something else is already waiting for your answer. Answer or cancel that first, one thing at a time."
  suggestions: "<dark_gray>Click one: "

# ─────────────────────────────────────────────────────────────────────────────
#  Nothing else here on purpose.
#
#  Core is a library: warps, votes, resource packs and achievements are things
#  it *manages*, not things it talks about. The sentences a player reads about
#  their own warp come from whichever plugin owns the command — and that plugin
#  registers its own wording, either in its own messages.yml or through
#  RainsCore.messages().define(...).
#
#  An earlier draft of this file had keys for all of them. They were removed:
#  a message file listing lines that never appear is worse than a short one,
#  because somebody translates them and then wonders why nothing changed.
# ─────────────────────────────────────────────────────────────────────────────

# ── vanish: saying something while hidden ────────────────────────────────────
vanish-chat:
  held: "<yellow>Psst — you're vanished. Saying <white><line></white> would tell everybody you're here."
  not-asking: "<gray>Sent. I'll stop asking until you reappear."
  kept: "<gray>Kept it to yourself. Nobody knows a thing."
